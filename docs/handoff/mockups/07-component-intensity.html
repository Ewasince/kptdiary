<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Компонент «уровень» (телефонная раскладка)</title>
<!-- Макет «Компонент «уровень» (телефонная раскладка)», размер артборда 390×140 px. Сконвертирован из дизайн-холста; открывается без зависимостей. -->

<style>
body{margin:0}
input[type=range]{accent-color:#2F6B8C}
input[type=number]{font-family:inherit}
button{font-family:inherit}
</style>

</head>
<body>
<div style="width: 390px; padding: 20px; box-sizing: border-box; font-family: Inter, -apple-system, Segoe UI, Roboto, Arial, sans-serif"><div style="display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; box-sizing: border-box; border-radius: 10px; background: #F4F6F8; color: #1F2328"><div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span style="font-size: 14px; font-weight: 500">Тревога</span><label style="display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: #2F6B8C"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Значение</span><input type="number" min="1" max="100" value="67" style="width: 60px; height: 34px; box-sizing: border-box; border: 1px solid #D9DEE3; border-radius: 8px; padding: 0 8px; font-family: inherit; font-size: 15px; font-weight: 600; color: #2F6B8C; text-align: right; background: #FFFFFF"><span></span></label></div><input type="range" min="1" max="100" value="67" aria-label="Тревога" style="width: 100%; height: 32px; margin: 0; accent-color: #2F6B8C"><div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px"><button type="button" style="height: 36px; border-radius: 8px; border: 1px solid #D9DEE3; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #A12F2F; padding: 0">−10</button>
<button type="button" style="height: 36px; border-radius: 8px; border: 1px solid #D9DEE3; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #A12F2F; padding: 0">−5</button>
<button type="button" style="height: 36px; border-radius: 8px; border: 1px solid #D9DEE3; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #A12F2F; padding: 0">−1</button>
<button type="button" style="height: 36px; border-radius: 8px; border: 1px solid #D9DEE3; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #1E6B3A; padding: 0">+1</button>
<button type="button" style="height: 36px; border-radius: 8px; border: 1px solid #D9DEE3; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #1E6B3A; padding: 0">+5</button>
<button type="button" style="height: 36px; border-radius: 8px; border: 1px solid #D9DEE3; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #1E6B3A; padding: 0">+10</button></div></div></div>
</body>
</html>
